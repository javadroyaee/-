name: Build Signed AvangVPN APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download and Verify Xray Core
        run: |
          mkdir -p app/libs
          ASSET_URL=$(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep "browser_download_url.*libv2ray\.aar" | cut -d '"' -f 4 | head -n 1)
          curl -fL "$ASSET_URL" -o app/libs/libv2ray.aar
          unzip -tq app/libs/libv2ray.aar
      - name: Generate Release Keystore
        run: |
          if [ ! -f app/avang_keystore.jks ]; then
            keytool -genkeypair -v -keystore app/avang_keystore.jks -alias avang_release_key -keyalg RSA -keysize 2048 -validity 10000 -storepass AvangSecure2026 -keypass AvangSecure2026 -dname "CN=JRweb, OU=Dev, O=JRweb, L=Tehran, S=Tehran, C=IR"
          fi
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AvangVPN-Pro-Signed
          path: app/build/outputs/apk/release/app-release.apk
